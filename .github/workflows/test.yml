name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix backend
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-report
          path: playtest-report/
